<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#dc2626" stroke-opacity="0.3" stroke-width="4" fill="none" />

  <!-- Circuit Trace Accents -->
  <path d="M96 256 H176 M336 256 H416 M256 96 V176 M256 336 V416" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  <circle cx="96" cy="256" r="8" fill="#38bdf8" />
  <circle cx="416" cy="256" r="8" fill="#38bdf8" />
  <circle cx="256" cy="96" r="8" fill="#38bdf8" />
  <circle cx="256" cy="416" r="8" fill="#38bdf8" />

  <!-- Central Chip Outer -->
  <rect x="160" y="160" width="192" height="192" rx="36" fill="#1e293b" stroke="#ef4444" stroke-width="8" filter="url(#glow)" />

  <!-- Central Die / Core -->
  <rect x="196" y="196" width="120" height="120" rx="20" fill="url(#coreGrad)" />

  <!-- Core Emblem: 'N' / Microprocessor -->
  <path d="M226 286 V226 L286 286 V226" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Corner Status Nodes -->
  <circle cx="206" cy="206" r="5" fill="#38bdf8" />
  <circle cx="306" cy="206" r="5" fill="#38bdf8" />
  <circle cx="206" cy="306" r="5" fill="#38bdf8" />
  <circle cx="306" cy="306" r="5" fill="#38bdf8" />
</svg>
